name: Fork Release (signed APK)

# 面向 fork 仓库的发布流程。
# 上游 release-app.yaml 有 `if: github.repository_owner == 'researchxxl'` 限制且依赖上游签名密钥，
# 在 fork 上无法使用，故提供一个自签名版本：构建 -> 用 CI 现场生成的密钥签名 -> 创建 Release。

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (must already exist, e.g. v2.1.7.0-fork.1)'
        required: true

concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug
    uses: ./.github/workflows/common-build.yaml
    with:
      buildType: "Debug"
      checkoutRef: ${{ inputs.tag || github.ref_name }}

  sign:
    name: Sign APK
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download unsigned APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-com.github.catfriend1.syncthingfork
          path: ./artifacts

      - name: Install Android build-tools
        run: |
          set -eu
          export ANDROID_HOME="$HOME/android-sdk"
          CMDLINE_TOOLS_VERSION="$(grep 'android-cmdline-tools = ' gradle/libs.versions.toml | cut -d '"' -f 2)"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          unzip -q "commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          mv cmdline-tools latest
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Sign APK with CI-generated keystore
        run: |
          set -eu
          mkdir -p signed
          keytool -genkeypair -keystore fork-release.jks -alias fork \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass android -keypass android \
            -dname "CN=Syncthing-Fork CI" -noprompt
          for apk in $(find artifacts -name '*.apk'); do
            echo "Signing $apk"
            apksigner sign \
              --ks fork-release.jks --ks-key-alias fork \
              --ks-pass pass:android --key-pass pass:android \
              --out "signed/$(basename "$apk")" "$apk"
          done
          apksigner verify signed/*.apk
          ls -la signed

      - name: Upload signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-fork-release
          path: |
            signed/*.apk

  release:
    name: Create GitHub release
    needs: [build, sign]
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-fork-release
          path: ./signed

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Syncthing-Fork ${{ inputs.tag || github.ref_name }} (selective sync)
          files: |
            signed/*.apk
          body: |
            Syncthing-Fork 个人构建，包含**选择性同步**功能（只同步手动勾选的文件夹或文件）。

            - 构建类型：Debug
            - 签名：CI 现场生成的自签名密钥（与官方发布签名不同，安装时需先卸载官方版本）
            - 实现方式：在 wrapper 层基于 `.stignore` 实现，未改动 Go 内核
            - 规则生成已通过 syncthing v2.1.6 双节点端到端真值校验

            已知限制：忽略规则对收发双向生效，未勾选的内容本机不会下载也不会上传。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
